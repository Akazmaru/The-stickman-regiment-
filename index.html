<title>The Seventh Stickman Regiment</title>
<style>
:root{--bg:#080a1c;--ink:#f4f1e8;--accent:#ffb703;--c:#ffb703;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#wrap{position:relative;width:min(100vw,200dvh);aspect-ratio:2/1;box-shadow:0 0 40px #6a3df066}
canvas{width:100%;height:100%;display:block;background:#0b1030}
button{font:inherit;color:#fff;font-weight:800;cursor:pointer;border:2px solid #ffffff55;border-radius:14px;background:linear-gradient(180deg,#2c3566,#161b3d);padding:8px 12px;transition:transform .12s,box-shadow .12s}

button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#menu{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;gap:clamp(6px,1.6vmin,10px);padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));background:radial-gradient(circle at 15% 5%,#2a1860 0,transparent 55%),radial-gradient(circle at 95% 95%,#0d3b5c 0,transparent 50%),#080a1c;overflow:hidden}
#hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ttl{min-width:0}
#tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
#cnt{font:800 11px monospace;padding:4px 9px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff33}
.ic{width:38px;height:38px;border-radius:50%;padding:0;font-size:17px;position:relative}
.bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#ff4d2e;font-size:11px;line-height:18px;text-align:center;padding:0 4px;border:1px solid #fff}
#menu::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 38px,#ffffff08 38px 39px),repeating-linear-gradient(90deg,transparent 0 38px,#ffffff08 38px 39px);pointer-events:none}
#menu>*{position:relative}
#chips{scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
h1{margin:0;font-size:clamp(13px,3.8vmin,24px);font-weight:900;letter-spacing:1.5px;background:linear-gradient(90deg,#ffb703,#ff4fd8,#6cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff4fd855)}
#msg{margin:2px 0 0;font-size:clamp(10px,2.4vmin,13px);opacity:.85}
#deck{display:flex;gap:10px;flex:1;min-height:0}
#stage{position:relative;flex:0 0 clamp(150px,32vw,260px);border-radius:18px;border:2px solid var(--c);background:radial-gradient(circle at 50% 75%,color-mix(in srgb,var(--c) 45%,transparent),transparent 65%),#0d1130;box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 30px #0008;overflow:hidden}
#pv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
#num{position:absolute;top:8px;left:10px;font:900 clamp(12px,3vmin,16px) monospace;color:var(--c);letter-spacing:1px}
#ctype{position:absolute;top:8px;right:10px;font-size:clamp(9px,2.2vmin,11px);font-weight:900;letter-spacing:1.5px;padding:3px 8px;border-radius:99px;background:var(--c);color:#080a1c}
#card{flex:1;min-width:0;overflow:auto;padding:clamp(8px,2vmin,14px);border-radius:18px;border:2px solid var(--c);background:linear-gradient(160deg,#171c4acc,#0b0e26cc);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent);touch-action:pan-y}
#cname{margin:0;font-size:clamp(18px,5vmin,30px);font-weight:900;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
#cdesc{margin:4px 0 8px;font-size:clamp(10px,2.5vmin,14px);line-height:1.35;opacity:.92}
.row{display:grid;grid-template-columns:clamp(46px,11vmin,64px) 1fr 20px;align-items:center;gap:6px;font-size:clamp(9px,2.2vmin,11px);font-weight:800;letter-spacing:1px;margin:3px 0}
.row i{display:block;height:8px;border-radius:99px;background:#ffffff1c;overflow:hidden}
.row b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),#fff);box-shadow:0 0 8px var(--c);transition:width .45s}
.row em{font-style:normal;text-align:right}
#cspec{margin-top:8px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px dashed var(--c);font-size:clamp(10px,2.4vmin,13px);line-height:1.3}
#cspec strong{display:block;color:var(--c);margin-bottom:2px;letter-spacing:1px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;touch-action:pan-x}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:clamp(11px,2.8vmin,14px);padding:7px 12px;border-color:var(--c)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#1a1f4f),#161b3d);box-shadow:0 0 16px var(--c);transform:translateY(-2px)}
#acts{display:flex;gap:8px;align-items:stretch}

#acts #fight{flex:2 1 140px;font-size:clamp(16px,4.4vmin,24px);letter-spacing:3px;background:linear-gradient(180deg,#ffb703,#ff4d2e);border-color:#fff4;box-shadow:0 0 22px #ff6a3dbb;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 34px #ffb703}}
@media (prefers-reduced-motion:reduce){#acts #fight{animation:none}}
@media (orientation:portrait){#deck{flex-direction:column}#stage{flex:0 0 40%}}
#jz{position:fixed;left:0;bottom:0;width:50vw;height:64dvh;z-index:6;touch-action:none}
#joy{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;border:2px solid rgba(160,215,255,.55);background:radial-gradient(circle,rgba(108,200,255,.16),rgba(8,12,40,.55));box-shadow:0 0 16px rgba(108,200,255,.35),inset 0 0 14px rgba(0,0,0,.5);opacity:.7;transition:opacity .15s;will-change:transform}
#joy::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(190,230,255,.35)}
#joy.act{opacity:1}
#knob{position:absolute;left:calc(50% - 26px);top:calc(50% - 26px);width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7cd0ff 55%,#2f7bff);border:2px solid #fff;box-shadow:0 0 12px rgba(108,200,255,.8);will-change:transform;pointer-events:none}
#pad{position:fixed;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:6}
#act{display:grid;grid-template-columns:auto auto auto;gap:8px;align-items:end;justify-items:end;pointer-events:auto}
#act .big{grid-row:1/3;grid-column:3}
.ab{position:relative;display:grid;place-items:center;width:clamp(50px,12vmin,76px);height:clamp(50px,12vmin,76px);border-radius:50%;border:3px solid #ffffffaa;color:#fff;padding:0;touch-action:none;transition:transform .08s,filter .15s}
.ab.big{width:clamp(72px,19vmin,110px);height:clamp(72px,19vmin,110px)}
.ab svg{width:56%;height:56%;fill:currentColor;filter:drop-shadow(0 2px 3px #0008);position:relative;z-index:2}
.ab::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,7,25,.66) calc(var(--cd,0)*360deg),transparent 0);z-index:1;pointer-events:none}
.ab.rdy{animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 24px var(--g),inset 0 0 8px #fff8}}
.ab.on{transform:scale(.88);filter:brightness(1.35)}
.ab.lock{filter:grayscale(.85) brightness(.8)}
#bpn{background:radial-gradient(circle at 35% 30%,#ffc27a,#e5441d);--g:#ff6a3d}
#bsp{background:radial-gradient(circle at 35% 30%,#d9a3ff,#5b2fe0);--g:#8a5cff}
#gd{background:radial-gradient(circle at 35% 30%,#bfeaff,#2f7bff);--g:#4aa3ff}
#pm{background:radial-gradient(circle at 35% 30%,#ffe9a0,#c77d00);--g:#ffb703;color:#2b1a00}
#tg{background:radial-gradient(circle at 35% 30%,#b6ffd9,#12945a);--g:#35d07f}
.tg{visibility:hidden}
body.team .tg{visibility:visible}
.bg{position:absolute;right:-2px;bottom:-2px;min-width:20px;height:20px;border-radius:10px;background:#0b1030;border:1px solid #fff8;font-size:12px;line-height:18px;text-align:center;z-index:3;color:#fff}
.bg:empty{display:none}
#rot{display:none;position:fixed;top:6px;left:0;right:0;text-align:center;font-size:12px;opacity:.8}
@media (orientation:portrait){#rot{display:block}}
body.menuopen #pad,body.menuopen #rot,body.menuopen #jz{display:none}
#acts{flex-wrap:wrap}
.chip.lock{opacity:.45;filter:grayscale(.6)}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,5,18,.93);padding:12px;touch-action:manipulation}
#ov[hidden]{display:none}
#box{width:min(520px,100%);max-height:100%;overflow:auto;border-radius:20px;border:2px solid #ffb703;background:linear-gradient(160deg,#171c4a,#0b0e26);padding:14px;text-align:center;box-shadow:0 0 30px #ffb70055}
#box canvas{width:min(280px,100%);height:auto;background:transparent;border-radius:12px;border:0}
#box p{font-size:14px;line-height:1.4;min-height:3.2em;margin:8px 0}
#box button{margin-top:6px;padding:10px 18px}
#box input{width:100%;padding:10px;border-radius:10px;border:2px solid #ffffff55;background:#0b0e26;color:#fff;font:inherit;font-weight:700;letter-spacing:2px;text-align:center;text-transform:uppercase;user-select:text;-webkit-user-select:text;margin:6px 0}
.bt{margin:0 0 6px;color:#ffb703;letter-spacing:2px}
#hud{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:7}
body:not(.menuopen) #hud{display:flex}
#hud button{width:38px;height:38px;border-radius:50%;padding:0;font-size:16px;border:2px solid #fff8;background:rgba(10,14,40,.82);box-shadow:0 0 10px #6cc8ff55}
.ic svg{width:58%;height:58%;fill:currentColor}
#rg{display:flex;align-items:center;gap:4px;font:800 12px monospace;padding:4px 9px;border-radius:99px;background:#ffb70018;border:1px solid #ffb70066;color:#ffd45a}
.gem{width:1em;height:1em;vertical-align:-.15em}
#acts #tv{flex:0 0 auto;border-radius:99px;background:linear-gradient(180deg,#1f4a66,#12263f)}
#cprime{margin-top:6px;padding:6px 10px;border-radius:12px;border:1px solid #ffb703;background:#ffb70014;font-size:12px}
.sr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--c);margin:6px 0;background:#ffffff08}
.sr.lk{opacity:.5}
.sn{flex:1 1 100%;text-align:left;font-weight:900;color:var(--c)}
.shb{flex:1 1 auto;font-size:12px;padding:7px 8px;margin:0!important}
.shb.p{background:linear-gradient(180deg,#ffd45a,#c77d00);color:#241500}
.shb:disabled{opacity:.5}
.bal{font-size:18px;font-weight:900;color:#ffd45a}
.hint{font-size:12px!important;opacity:.8;min-height:0!important}
#sl{max-height:42vh;overflow:auto;touch-action:pan-y}
#tst{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:99px;background:rgba(10,14,40,.94);border:1px solid #ffb703;font-size:13px;font-weight:800;z-index:30;opacity:0;pointer-events:none;max-width:92vw;text-align:center}
#tst.sh{animation:tsh 2.4s}
@keyframes tsh{0%{opacity:0;transform:translate(-50%,-8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
</style>
</head>
<body class="menuopen">
<div id="wrap">
  <canvas id="c" width="720" height="360"></canvas>
</div>
<div id="menu">
  <div id="hdr"><div id="ttl"><h1>THE SEVENTH STICKMAN REGIMENT</h1><p id="msg">Choose your fighter, then hit FIGHT.</p></div>
    <div id="tools"><span id="rg"></span><span id="cnt"></span><button class="ic" id="shp" aria-label="Shop"></button><button class="ic" id="wb" aria-label="Wheel of Fate"></button><button class="ic" id="rc" aria-label="Redeem code"></button><button class="ic" id="mb" aria-label="Music"></button><button class="ic" id="ml" aria-label="Load your own song"></button></div></div>
  <div id="deck">
    <div id="stage"><canvas id="pv" width="260" height="230"></canvas><span id="num"></span><span id="ctype"></span></div>
    <div id="card"><h2 id="cname"></h2><p id="cdesc"></p><div id="stats"></div><div id="cspec"></div><div id="cprime"></div></div>
  </div>
  <div id="chips"></div>
  <div id="acts"><button id="boss"></button><button id="tv"></button><button id="fight">⚔ FIGHT</button></div>

</div>

<div id="jz"><div id="joy"><span id="knob"></span></div></div>
<div id="pad"><div id="act">
<button class="ab tg" id="tg" data-k="tag" aria-label="Swap fighter"><svg viewBox="0 0 24 24"><path d="M3 8h13l-3.5-3.5L14 3l6.5 6.5L14 16l-1.5-1.5L16 11H3zM21 16H8l3.5 3.5L10 21l-6.5-6.5L10 8l1.5 1.5L8 13h13z" transform="scale(.95) translate(.6 0)"/></svg></button>
<button class="ab" id="pm" data-k="prime" aria-label="Prime"><svg viewBox="0 0 24 24"><path d="M12 1l9 9-9 13L3 10z"/><path d="M12 5l5 5-5 8-5-8z" fill="#fff6" /></svg></button>
<button class="ab" id="gd" data-k="guard" aria-label="Defend"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.500-2-8-6-8-11V5z"/></svg><span class="bg" id="gdb"></span></button>
<button class="ab" id="bsp" data-k="special" aria-label="Special"><svg viewBox="0 0 24 24"><path d="M12 1l3 7 7 .8-5.300 4.700L18.200 21 12 17.300 5.800 21l1.500-7.500L2 8.800 9 8z"/></svg></button>
<button class="ab big" id="bpn" data-k="punch" aria-label="Attack"><svg viewBox="0 0 24 24"><rect x="5" y="9.500" width="14" height="10" rx="3.500"/><circle cx="7.500" cy="8.500" r="2.300"/><circle cx="12" cy="7.500" r="2.300"/><circle cx="16.500" cy="8.500" r="2.300"/><rect x="17" y="12" width="4.500" height="6" rx="2.200"/></svg></button>
</div></div>
<div id="tst"></div>
<script>
const cv=document.getElementById('c'),W=720,H=360,GY=300;let g=cv.getContext('2d');
const FIGHTERS={
  turbi:{name:'Turbi',sub:'big, tanky, meteor shower',color:'#ff8a1f',dmg:15,cd:600,kb:10,hit:'bonk',spd:.85,def:.55,sz:1.35},
  vg:{name:'VG',sub:'small, fast, crescent slash',color:'#2f7bff',dmg:7,cd:150,kb:3,hit:'tick',spd:1.35,def:1,sz:.8},
  nocooked:{name:'Notcooked',sub:'slice storm special',color:'#1b2a6b',dmg:11,cd:280,kb:6,hit:'bonk',spd:1.05,def:.75,sz:1.1},
  mothwing:{name:'Boss Mothwing',sub:'BOSS',color:'#ff4fd8',dmg:22,cd:700,kb:14,hit:'bonk',spd:1,def:.8,sz:1.6,hp:300,boss:1},
  yas:{name:'SpeedyYas',sub:'fast, teleport strike',color:'#7cf08a',dmg:8,cd:200,kb:4,hit:'tick',spd:1.5,def:1,sz:.9},
  vir:{name:'Vir',sub:'telekinesis throw',color:'#7aa2ff',dmg:9,cd:400,kb:6,hit:'tick',spd:1,def:.9,sz:1},
  vynxie:{name:'Vynxie',sub:'katana, aqua beam',color:'#14b8a6',dmg:9,cd:240,kb:4,hit:'tick',spd:1.2,def:1,sz:1.2},
  wobbles:{name:'Sir Wobbles',sub:'rubber chicken knight',color:'#f4c542',dmg:6,cd:380,kb:6,hit:'tick',spd:.95,def:1,sz:1},
  toast:{name:'Captain Toast',sub:'toast barrage',color:'#d98b3a',dmg:7,cd:300,kb:4,hit:'tick',spd:1.05,def:1,sz:.95}
};
const keys={left:0,right:0,jump:0,punch:0,special:0,guard:0,prime:0,tag:0};
let state='menu',wins=[0,0],round=1,shake=0,msgT=0,player,enemy,audio,bossWins=0,buffs={},vsT=0,pr=null,primeUsed=false,TM=null,tagCd=0;

function mk(id,x,dir,ai){const F=FIGHTERS[id],n=F.boss?Math.min(bossWins,30):0,bf=(!ai&&buffs[id])||[],mh=Math.round((F.hp||100)*(1+.05*n)*(bf.includes('hp')?1.1:1));return{id,f:F,x,y:GY,vx:0,vy:0,dir,hp:mh,mhp:mh,ai,pc:0,sc:0,atk:0,combo:0,lastHit:0,stun:0,lv:F.boss?n+1:0,sh:0,shT:0,shCd:0,hit:0,down:0,rt:0,dmgM:(1+.04*n)*(bf.includes('dmg')?1.1:1),spdM:(1+.02*n)*(bf.includes('spd')?1.08:1)}}
let nbuf=null;
function ctx(){audio=audio||new (window.AudioContext||window.webkitAudioContext)();return audio}
function noise(t,dur,vol,type,freq,dest){const a=ctx();if(!nbuf){nbuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();s.buffer=nbuf;f.type=type;f.frequency.value=freq;s.connect(f);f.connect(v);v.connect(dest||a.destination);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);s.start(t);s.stop(t+dur+.02)}
function tone(f0,f1,t,dur,vol,ty){const a=ctx(),o=a.createOscillator(),v=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);o.connect(v);v.connect(a.destination);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur+.02)}
function sfx(type){try{const a=ctx(),t=a.currentTime;
  if(type==='tick'){noise(t,.08,.25,'highpass',1800);tone(260,90,t,.1,.28,'triangle')}
  else if(type==='bonk'){noise(t,.14,.3,'lowpass',900);tone(170,45,t,.22,.5,'square');tone(900,500,t,.08,.12,'triangle')}
  else if(type==='jump')tone(300,700,t,.12,.12,'sine');
  else if(type==='special'){tone(220,1400,t,.35,.14,'sawtooth');tone(440,2200,t+.05,.3,.07,'triangle');noise(t+.25,.2,.12,'highpass',3000)}
  else if(type==='round'){[392,523,659].forEach((f,i)=>tone(f,f,t+i*.12,.25,.14,'square'));tone(784,784,t+.4,.5,.16,'square')}
  else if(type==='win'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f*1.003,t+i*.13,.35,.15,'square'));noise(t+.9,.5,.1,'highpass',4000)}
  else if(type==='lose'){[440,392,349,392].forEach((f,i)=>tone(f,f*.99,t+i*.2,.4,.12,'triangle'))}
  else if(type==='prime'){tone(100,600,t,.9,.25,'sawtooth');tone(200,1600,t+.3,.6,.12,'triangle');noise(t+.6,.5,.2,'lowpass',2000)}
  else if(type==='shield'){tone(300,900,t,.25,.12,'sine');tone(600,1400,t+.05,.25,.07,'triangle')}
  else if(type==='shieldhit'){noise(t,.08,.2,'highpass',2500);tone(1200,700,t,.12,.18,'square')}
  else if(type==='shieldbreak'){noise(t,.35,.35,'highpass',1800);tone(900,200,t,.3,.2,'sawtooth')}
  else if(type==='squeak'){tone(700,1700,t,.12,.14,'square');tone(1700,900,t+.1,.1,.1,'square')}

  if(f.met){const p=1-f.t/26,cx=f.x-(1-p)*120,cy=-20+p*(GY+20);g.save();g.globalAlpha=.55;g.strokeStyle='#ff4d4d';g.lineWidth=2;g.beginPath();g.ellipse(f.x,GY+2,24,6,0,0,7);g.stroke();g.globalAlpha=1;g.shadowColor='#ff8a1f';g.shadowBlur=16;g.strokeStyle='#ff6a00';g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(cx-19,cy-50);g.lineTo(cx,cy);g.stroke();g.fillStyle='#ffd27a';g.beginPath();g.arc(cx,cy,9,0,7);g.fill();g.restore();f.t--;return}
  if(f.wave){g.save();g.globalAlpha=f.t/22;g.strokeStyle=f.col||'#ffb37a';g.lineWidth=5;const r=(22-f.t)*13*(f.s||1);g.beginPath();g.ellipse(f.x,GY+2,r,r*.18,0,0,7);g.stroke();g.restore();f.t--;return}
  if(f.bolt){g.save();g.fillStyle='rgba(255,250,190,'+f.t/40+')';g.fillRect(-20,-20,W+40,H+40);g.lineJoin='round';g.shadowColor='#fff27a';g.shadowBlur=22;[['#ffe94d',9],['#fff',3]].forEach(p=>{g.strokeStyle=p[0];g.lineWidth=p[1];g.beginPath();g.moveTo(f.x,0);for(let y=30;y<GY;y+=30)g.lineTo(f.x+Math.sin(f.seed+y*.7)*22,y);g.lineTo(f.x,GY);g.stroke()});g.restore();f.t--;return}
  if(f.arc){g.save();g.globalAlpha=Math.max(0,f.t/18);g.lineCap='round';g.strokeStyle='#6cc8ff';g.lineWidth=9;g.beginPath();g.arc(f.x-f.d*40,f.y,75,f.d>0?-1.1:Math.PI-1.1,f.d>0?1.1:Math.PI+1.1);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(f.x-f.d*40,f.y,66,f.d>0?-1:Math.PI-1,f.d>0?1:Math.PI+1);g.stroke();g.restore();f.t--;return}{const L=f.l||75,w=f.w||7,ux=Math.cos(f.a),uy=Math.sin(f.a),vx=-uy,vy=ux,al=Math.max(0,f.t/22);g.save();g.fillStyle='rgba(170,200,255,'+(.5*al)+')';g.beginPath();g.moveTo(f.x-ux*L,f.y-uy*L);g.lineTo(f.x+vx*w,f.y+vy*w);g.lineTo(f.x+ux*L,f.y+uy*L);g.lineTo(f.x-vx*w,f.y-vy*w);g.closePath();g.fill();g.fillStyle='rgba(255,255,255,'+(.85*al)+')';g.beginPath();g.moveTo(f.x-ux*L*.9,f.y-uy*L*.9);g.lineTo(f.x+vx*w*.3,f.y+vy*w*.3);g.lineTo(f.x+ux*L*.9,f.y+uy*L*.9);g.lineTo(f.x-vx*w*.3,f.y-vy*w*.3);g.closePath();g.fill();g.restore();f.t--}});
  if(combo>=3&&performance.now()-comboT<1200){g.save();g.globalAlpha=Math.min(1,(1200-(performance.now()-comboT))/400);g.fillStyle='#ffb703';g.shadowColor='#ff4d2e';g.shadowBlur=14;g.font='bold 28px Trebuchet MS';g.textAlign='center';g.fillText('COMBO x'+combo+'!',W/2,92);g.restore()}
  for(let i=fx.length-1;i>=0;i--)if(fx[i].t<=0)fx.splice(i,1);
  if(vsT>0)drawVS();
  if(state==='paused'){g.fillStyle='rgba(5,6,20,.62)';g.fillRect(-20,-20,W+40,H+40);g.fillStyle='#fff';g.font='bold 40px Trebuchet MS';g.textAlign='center';g.fillText('PAUSED',W/2,H/2);g.font='14px Trebuchet MS';g.fillText('Tap ▶ to resume',W/2,H/2+28);g.textAlign='left'}
  g.restore()}
let last=performance.now();
(function loop(t){const dt=t-last;last=t;step(dt);draw();requestAnimationFrame(loop)})(last);

const km={a:'left',arrowleft:'left',d:'right',arrowright:'right',w:'jump',arrowup:'jump',' ':'jump',j:'punch',k:'special',l:'guard',i:'prime',o:'tag'};
addEventListener('keydown',e=>{const k=km[e.key.toLowerCase()];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=km[e.key.toLowerCase()];if(k)keys[k]=0});
addEventListener('contextmenu',e=>e.preventDefault());
(function(){const jz=$('jz'),jb=$('joy'),kn=$('knob');let id=null,ox=0,oy=0;const R=52;
  function mv(e){let dx=e.clientX-ox,dy=e.clientY-oy;const m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m}kn.style.transform='translate3d('+dx+'px,'+dy+'px,0)';keys.left=dx<-R*.25?1:0;keys.right=dx>R*.25?1:0;keys.jump=dy<-R*.5?1:0}
  function rs(){id=null;kn.style.transform='translate3d(0,0,0)';jb.classList.remove('act');jb.style.left=jb.style.top=jb.style.bottom='';keys.left=keys.right=keys.jump=0}
  jz.addEventListener('pointerdown',e=>{if(id!==null)return;e.preventDefault();id=e.pointerId;ox=e.clientX;oy=e.clientY;const r=jz.getBoundingClientRect();jb.classList.add('act');jb.style.left=(ox-r.left-56)+'px';jb.style.top=(oy-r.top-56)+'px';jb.style.bottom='auto';try{jz.setPointerCapture(id)}catch(_){}mv(e)});
  jz.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>jz.addEventListener(t,e=>{if(e.pointerId===id)rs()}));
})();
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  ['pointerdown'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}}));
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=0;b.classList.remove('on')}))});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(r=>{r.update();setInterval(()=>r.update(),60000)}).catch(()=>{});
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had){try{note('✨ Update installed! Close and reopen the app to play the new version.')}catch(e){}}had=true});
}
